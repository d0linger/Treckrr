name: Docker (GHCR multi-arch image)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. packages: write is granted ONLY to the job that
# pushes — at workflow level it also applied to pull_request runs, which never
# push and therefore never need it.
permissions:
  contents: read

env:
  # Kept in step with ci.yml's GO_VERSION.
  GO_VERSION: "1.27.1"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Publication gate. This workflow is independent of ci.yml, so a push to main
  # published an image whether or not the tests passed — the registry could end up
  # ahead of anything that was ever verified, with only branch protection (a
  # setting outside this repository) standing in the way.
  #
  # It re-runs the checks here rather than chaining on ci.yml via workflow_run, so
  # a tag push and a manual dispatch are gated too, not only pushes to main. The
  # Postgres service mirrors ci.yml so the DB-backed tests actually run instead of
  # skipping themselves.
  verify:
    name: Verify (build, vet, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treckrr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: treckrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treckrr"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://treckrr:test@localhost:5432/treckrr_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Verify promotion guards (mocked, no registry writes)
        run: bash .github/scripts/promote-image-test.sh
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Install matching PostgreSQL client
        env:
          PG_MAJOR: "16"
        run: bash .github/scripts/setup-postgres-client.sh
      # The same guard ci.yml carries, and it matters more here: this job decides
      # whether an image is published. Without it, a Postgres service that failed
      # to start would let every DB-backed test skip, the job would report green,
      # and the image would ship on a verification that never ran.
      - name: Verify the integration database is reachable
        run: |
          test -n "$TEST_DATABASE_URL" || { echo "TEST_DATABASE_URL is unset — DB tests would silently skip"; exit 1; }
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U treckrr && break
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U treckrr
      # Match CI: include tagged regressions and serialize packages sharing
      # the service database before allowing an image to be published.
      - name: Test (unit + integration)
        run: go test -race -tags=integration -p 1 ./...
      - name: Build
        run: go build ./...

      - name: Reachable Go vulnerability gate
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  build-push:
    name: Build candidate (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    needs: verify
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Minify the embedded static JS before the image build so the shipped image
      # (go:embed internal/web/static) carries the compact assets. Runs in the
      # ephemeral workspace only — the committed sources stay readable. node --check
      # syntax-verifies each result so a broken minify fails the build.
      - name: Minify static JavaScript
        run: |
          for f in internal/web/static/js/app.js \
                   internal/web/static/js/entry-form.js \
                   internal/web/static/js/passkey.js \
                   internal/web/static/js/recovery.js \
                   internal/web/static/sw.js; do
            npx --yes esbuild@0.28.2 "$f" --minify --allow-overwrite --outfile="$f"
            node --check "$f"
          done

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize registry name
        id: image
        shell: bash
        run: echo "name=$REGISTRY/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Convenient source tag, NOT immutable: pin deployments by digest.
            type=sha,format=short,enable={{is_default_branch}}

      - name: Build and push candidate only
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PRs only build (no push) to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.image.outputs.name }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          labels: ${{ steps.meta.outputs.labels }}
          # Forces the Dockerfile's `apk upgrade` layer to re-resolve on every
          # published build. Without it the deployable image can be assembled from
          # a cached package layer and ship Alpine packages from whenever that
          # layer was built — the weekly image scan would be current while the
          # artifact people actually run is not. Only this one layer is busted;
          # the Go module and build layers keep their cache.
          build-args: |
            APK_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan-candidate:
    name: Scan published candidate (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Gate exact candidate digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-push.outputs.image }}@${{ needs.build-push.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate candidate SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build-push.outputs.image }}@${{ needs.build-push.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.arch }}.cdx.json
          exit-code: "0"
      - name: Upload candidate SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.arch }}
          path: sbom-${{ matrix.arch }}.cdx.json
          if-no-files-found: error

  promote:
    name: Promote verified digest (no rebuild)
    if: github.event_name != 'pull_request'
    needs: [build-push, scan-candidate]
    runs-on: ubuntu-latest
    concurrency:
      group: treckrr-release-promotion
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the still-current ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build-push.outputs.image }}
          DIGEST: ${{ needs.build-push.outputs.digest }}
          RELEASE_TAGS: ${{ needs.build-push.outputs.tags }}
        run: bash .github/scripts/promote-image.sh
