name: Docker (GHCR multi-arch image)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default. packages: write is granted ONLY to the job that
# pushes — at workflow level it also applied to pull_request runs, which never
# push and therefore never need it.
permissions:
  contents: read

env:
  # Kept in step with ci.yml's GO_VERSION.
  GO_VERSION: "1.27.0"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Publication gate. This workflow is independent of ci.yml, so a push to main
  # published an image whether or not the tests passed — the registry could end up
  # ahead of anything that was ever verified, with only branch protection (a
  # setting outside this repository) standing in the way.
  #
  # It re-runs the checks here rather than chaining on ci.yml via workflow_run, so
  # a tag push and a manual dispatch are gated too, not only pushes to main. The
  # Postgres service mirrors ci.yml so the DB-backed tests actually run instead of
  # skipping themselves.
  verify:
    name: Verify (build, vet, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: treckrr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: treckrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treckrr"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://treckrr:test@localhost:5432/treckrr_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Resolve dependencies
        run: go mod tidy
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  build-push:
    name: Build & Push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Minify the embedded static JS before the image build so the shipped image
      # (go:embed internal/web/static) carries the compact assets. Runs in the
      # ephemeral workspace only — the committed sources stay readable. node --check
      # syntax-verifies each result so a broken minify fails the build.
      - name: Minify static JavaScript
        run: |
          for f in internal/web/static/js/app.js \
                   internal/web/static/js/entry-form.js \
                   internal/web/static/js/passkey.js \
                   internal/web/static/js/recovery.js \
                   internal/web/static/sw.js; do
            npx --yes esbuild@0.28.2 "$f" --minify --allow-overwrite --outfile="$f"
            node --check "$f"
          done

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PRs only build (no push) to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
