name: Docker (GHCR multi-arch image)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & Push (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Minify the embedded static JS before the image build so the shipped image
      # (go:embed internal/web/static) carries the compact assets. Runs in the
      # ephemeral workspace only — the committed sources stay readable. node --check
      # syntax-verifies each result so a broken minify fails the build.
      - name: Minify static JavaScript
        run: |
          for f in internal/web/static/js/app.js \
                   internal/web/static/js/entry-form.js \
                   internal/web/static/js/passkey.js \
                   internal/web/static/js/recovery.js \
                   internal/web/static/sw.js; do
            npx --yes esbuild@0.24.2 "$f" --minify --allow-overwrite --outfile="$f"
            node --check "$f"
          done

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # PRs only build (no push) to validate the Dockerfile.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
