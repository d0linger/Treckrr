name: Supply chain (SBOM + vuln scan)

# Release gating is in docker-publish.yml. Periodic scans use existing digests,
# never a rebuild that could hide vulnerabilities still present in production.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  runtime:
    name: Rescan existing image (${{ matrix.arch }}, ${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        target: [published, production]
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve existing immutable digest
        id: image
        env:
          TARGET: ${{ matrix.target }}
          PRODUCTION_DIGEST: ${{ vars.PRODUCTION_IMAGE_DIGEST }}
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$TARGET" == production ]]; then
            if [[ -z "$PRODUCTION_DIGEST" ]]; then
              echo "::warning::PRODUCTION_IMAGE_DIGEST is unset; deployed-image coverage is unknown."
              echo "Production digest is unset: deployment coverage is UNKNOWN." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            digest="$PRODUCTION_DIGEST"
          else
            digest="sha256:$(docker buildx imagetools inspect "$image:latest" --raw | sha256sum | cut -d' ' -f1)"
          fi
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest"; exit 1; }
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Scanning $image@$digest ($TARGET)" >> "$GITHUB_STEP_SUMMARY"
      - name: Scan existing runtime image
        if: steps.image.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate existing-image SBOM
        if: always() && steps.image.outputs.ref != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - name: Upload SBOM
        if: always() && steps.image.outputs.ref != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.target }}-${{ matrix.arch }}
          path: sbom.cdx.json
          if-no-files-found: error
