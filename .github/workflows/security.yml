name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # weekly, Monday 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.0"

jobs:
  gosec:
    name: GOSec (static security scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod tidy
      - name: Run gosec
        uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
        env:
          # The gosec container bundles its own Go with GOTOOLCHAIN=local,
          # which can lag behind the go.mod requirement (e.g. 1.26.2 vs
          # 1.26.6). Let it download the exact toolchain instead. Track the
          # go.mod language floor here, NOT the build toolchain — forcing a
          # newer Go makes it emit export data this gosec build cannot read.
          GOTOOLCHAIN: go1.26.6
        with:
          # Excluded rules (all reviewed and intentional):
          #   G115 – int64→uint64 of a non-negative Unix time (TOTP counter); safe.
          #   G505 – crypto/sha1: RFC 6238 (TOTP) mandates HMAC-SHA1.
          #   G124 – cookies use a deliberately dynamic Secure flag so the app can
          #          run over plain HTTP behind a TLS-terminating reverse proxy
          #          (HttpOnly + SameSite are always set on session cookies).
          #   G706 – log injection: request-derived fields are sanitised via
          #          sanitizeLog(); gosec's taint analysis can't see the custom
          #          sanitiser, so it is excluded rather than left unmitigated.
          # G204 (pg_dump/pg_restore) and G304 (operator-supplied restore paths)
          # are suppressed at the call site with `// #nosec` in internal/backup,
          # so they stay enabled everywhere else.
          args: -exclude=G115,G124,G505,G706 ./...

  govulncheck:
    name: GOVul (vulnerability check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go mod tidy
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: govulncheck ./...
