name: E2E (Playwright)

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Browser smoke (login → booking → Beleg)
    runs-on: ubuntu-latest
    # Measured full run: ~24 min including failure retries, before image setup.
    # Leave build/download margin without relaxing per-test deadlines.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Same disposable stack, seed, browser image and command as local.
      - name: Run isolated E2E
        run: node e2e/run.mjs
