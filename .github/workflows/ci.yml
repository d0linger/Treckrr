name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      # The delete-guard mapping depends on the server version (RESTRICT raises
      # 23503 on PG 16 but 23001 on PG 18 — measured, fixed in ccdb566), so the
      # suite runs against both: 16 is what ships, 18 is what the upgrade lands
      # on. Anything version-dependent breaks HERE, not on the production box.
      fail-fast: false
      matrix:
        pgver: ["16", "18"]
    # A Postgres service, because 27 test files skip themselves without
    # TEST_DATABASE_URL. Without it the DB-backed suite — migrations, the
    # append-only audit guard, the 0039 deletion constraints, money integrity,
    # invoice numbering, the rate limiters — was green by OMISSION: those tests
    # ran only when someone remembered to start a database by hand.
    services:
      postgres:
        image: postgres:${{ matrix.pgver }}-alpine
        env:
          POSTGRES_USER: treckrr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: treckrr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U treckrr"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://treckrr:test@localhost:5432/treckrr_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # download, not tidy: `go mod tidy` REWRITES go.mod/go.sum, so a missing or
      # wrong checksum is silently repaired instead of failing — the committed
      # files would never actually be validated. Same reasoning as the Dockerfile.
      - name: Download dependencies
        run: go mod download
      - name: Verify modules
        run: go mod verify
      # And prove the committed files are already tidy, rather than letting drift
      # accumulate unnoticed. GO_VERSION is pinned exactly, so this is deterministic.
      - name: Check go.mod/go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet -tags=integration ./...
      - name: Install matching PostgreSQL client
        env:
          PG_MAJOR: ${{ matrix.pgver }}
        run: bash .github/scripts/setup-postgres-client.sh
      # Fails loudly if the service or the variable ever disappears again, rather
      # than letting the DB-backed tests quietly skip.
      - name: Verify the integration database is reachable
        run: |
          test -n "$TEST_DATABASE_URL" || { echo "TEST_DATABASE_URL is unset — DB tests would silently skip"; exit 1; }
          for _ in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U treckrr && break
            sleep 1
          done
          pg_isready -h localhost -p 5432 -U treckrr
      # Include tagged regressions; packages share the service database, so
      # serialize packages to keep their database fixtures from interfering.
      - name: Test (unit + integration)
        run: go test -race -tags=integration -p 1 -coverprofile=coverage.out ./...
      # The profile used to be written and thrown away, so a slide in coverage
      # was invisible. The floor is deliberately a few points BELOW the current
      # figure: it catches a real regression (a whole handler family losing its
      # tests) without turning every refactor into a threshold fight. Raise it
      # when the number rises, never lower it to make a red build pass.
      - name: Coverage floor
        if: matrix.pgver == '16'
        run: |
          go tool cover -func=coverage.out | tail -1
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')
          floor=50.0
          awk -v t="$total" -v f="$floor" 'BEGIN {
            if (t+0 < f+0) { print "coverage " t "% is below the " f "% floor"; exit 1 }
            print "coverage " t "% (floor " f "%)"
          }'
      - name: Upload coverage profile
        if: matrix.pgver == '16'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 14
      - name: Build
        run: go build ./...

  golangci-lint:
    name: GOLint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Download dependencies
        run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.1
          args: --build-tags=integration
