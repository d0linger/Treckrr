name: DeadCode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.6"

jobs:
  deadcode:
    name: DeadCode (unreachable function analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.48.0
      - name: Run deadcode
        # deadcode always exits 0, so fail the job explicitly on any finding.
        # -test keeps functions reachable only from tests from being flagged.
        run: |
          out=$(deadcode -test ./...)
          if [ -n "$out" ]; then
            echo "Dead code found:"
            echo "$out"
            exit 1
          fi
          echo "No dead code found."
