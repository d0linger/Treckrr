name: DeadCode

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"

jobs:
  deadcode:
    name: DeadCode (unreachable function analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Test deadcode gate failure handling
        run: node --test .github/scripts/check-deadcode.test.mjs
      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@v0.49.0
      - name: Run deadcode
        run: sh .github/scripts/check-deadcode.sh
