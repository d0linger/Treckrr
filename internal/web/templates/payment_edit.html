{{define "content"}}
<section class="stack">
	<div class="pagehead">
		<a class="backbtn" href="{{.Back}}" aria-label="Zurück">{{template "ic-back"}}</a>
		<h1 class="pagehead__t">Zahlung bearbeiten</h1>
	</div>
	<p class="muted small">{{.NeighborName}} · erfasst am {{date .Payment.Created}}{{if .Payment.InvoiceNumber}} · Rechnung {{.Payment.InvoiceNumber}}{{end}}</p>
	<form method="post" action="/payments/{{.Payment.ID}}/update" class="card form">
		<div class="form__grid">
			<label class="field"><span>Betrag (€)</span>
				<input class="input" type="number" step="0.01" min="0" name="amount" value="{{num .Payment.Amount}}" required></label>
			<label class="field"><span>Datum</span>
				<input class="input" type="date" name="paid_on" value="{{.Payment.PaidOn.Format "2006-01-02"}}"></label>
			<label class="field"><span>Zahlungsart</span>
				<select class="select" name="method">
					<option value="" {{if eq .Payment.Method ""}}selected{{end}}>—</option>
					<option value="überweisung" {{if eq .Payment.Method "überweisung"}}selected{{end}}>Überweisung</option>
					<option value="bar" {{if eq .Payment.Method "bar"}}selected{{end}}>Bar</option>
					<option value="verrechnung" {{if eq .Payment.Method "verrechnung"}}selected{{end}}>Verrechnung</option>
				</select></label>
			<label class="field"><span>Notiz</span>
				<input class="input" name="note" value="{{.Payment.Note}}"></label>
		</div>
		<div class="btnrow">
			<button class="btn btn--primary btn--sm" type="submit">Speichern</button>
			<a class="btn btn--ghost btn--sm" href="{{.Back}}">Abbrechen</a>
		</div>
	</form>
</section>
{{end}}
