{{define "content"}}
<section class="stack" data-base-id="{{.Base.ID}}">
	<a class="backlink" href="/neighbors/{{.Neighbor.ID}}?year={{.Year.ID}}">‹ Zurück zu {{.Neighbor.Name}}</a>
	<h2 class="section-title">{{if .BookingCopy}}Buchung kopieren{{else}}Buchung bearbeiten{{end}} · {{.Year.Year}}</h2>
	{{template "booking-form" .}}
	{{if not .BookingCopy}}{{template "booking-extras" .}}{{end}}
</section>
{{end}}

{{define "scripts"}}<script src="/static/js/unified-booking.js?v={{.AssetVersion}}" defer></script><script src="/static/js/entry-form.js?v={{.AssetVersion}}" defer></script>{{end}}
