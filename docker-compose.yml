services:
  db:
    image: postgres:16-alpine
    container_name: treckrr-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-treckrr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-treckrr-db-password-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-treckrr}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-treckrr} -d ${POSTGRES_DB:-treckrr}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # DB is only reachable from the app on the internal network by default.
    # Uncomment to expose it on the host for debugging.
    # ports:
    #   - "5432:5432"

  app:
    build: .
    container_name: treckrr-app
    restart: unless-stopped
    # Hardening — works the same under rootless Docker/Podman. The app writes
    # nothing to disk (state is in Postgres, logs go to stdout), so the root
    # filesystem is read-only with a small tmpfs for /tmp.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_PORT: ${APP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://treckrr:treckrr-db-password-change-me@db:5432/treckrr?sslmode=disable}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-please-generate-a-random-value}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin-password}
      # Passkeys (WebAuthn). Must match the URL the browser uses. For production
      # set RP_ID to your host (no scheme) and RP_ORIGIN to the full origin.
      RP_ID: ${RP_ID:-localhost}
      RP_ORIGIN: ${RP_ORIGIN:-http://localhost:8080}
      # Break-glass admin password reset (see .env.example); off by default.
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      # Encrypted backups (AES-256-GCM). Set BACKUP_ENCRYPTION_KEY (≥16 chars,
      # separate from SESSION_SECRET) to enable on-demand + scheduled backups.
      # Empty = backups disabled. The key is NOT recoverable — store it safely.
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_STATUS_FILE: ${BACKUP_STATUS_FILE:-/backups/status.json}
      # Schedule (cron) is configured in the admin Backup panel, not here.
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      # Optional off-box S3/Backblaze destination for scheduled backups (3-2-1).
      # Empty S3_ENDPOINT/S3_BUCKET disables it.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      # Structured logging: LOG_FORMAT text|json, LOG_LEVEL debug|info|warn|error.
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Prometheus /metrics (opt-in). Set a long random token to enable; scrapers
      # send "Authorization: Bearer <token>". Empty = endpoint disabled.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    # The app writes encrypted dumps here (scheduled) and reads status.json.
    # A NAMED volume is used so it inherits the image's /backups ownership
    # (uid 10001) — the app runs non-root and a root-owned bind mount would
    # fail with EACCES. To use a host path instead, mount `./backups:/backups`
    # and `chown 10001:10001 ./backups` on the host first.
    # Sync the dumps off-box (second disk/NAS) — a backup next to the DB it
    # protects is not a backup (e.g. the S3 destination below).
    volumes:
      - backups:/backups
    ports:
      - "${HOST_PORT:-8080}:${APP_PORT:-8080}"

  # Backups are now produced by the app itself (encrypted, AES-256-GCM):
  # on-demand from the admin Backup panel and on a schedule (cron, set in the panel).
  # The separate backup container was removed. Restore is a deliberate CLI op
  # (the entrypoint already runs /app/treckrr, so no binary name is needed):
  #   docker compose run --rm app restore <file.dump.enc>

volumes:
  pgdata:
  backups:
